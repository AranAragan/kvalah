name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Syntax check (node --check)
        run: npm run check
      - name: Tests
        run: npm test

  package:
    name: Packaging smoke build (Linux, unpacked)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: electron-builder --dir
        run: npx electron-builder --linux dir --publish never
      - name: Desktop smoke test (Xvfb)
        run: |
          export KVALAH_TEST_ROOT="$RUNNER_TEMP/kvalah-smoke" KVALAH_SMOKE_TEST=1
          xvfb-run -a release/linux-unpacked/kvalah --no-sandbox
          test -f "$KVALAH_TEST_ROOT/smoke-result.json"
          head -c 600 "$KVALAH_TEST_ROOT/smoke-result.json"
