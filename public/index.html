<!doctype html>
<html lang="ru" data-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>kvalah</title><meta name="theme-color" content="#F07866"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" href="/app-icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icon-192.png"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/style.css"></head>
<body>
<div id="app">
  <aside id="sidebar" data-i18n-aria="sidebar.history">
    <div class="side-top"><a class="brand" href="/" aria-label="kvalah"><span class="brand-mark"><img src="/logo.svg" alt=""></span><span>kvalah</span><span class="local-pill">LOCAL</span></a><button class="icon" id="closeSide" data-i18n-title="sidebar.hide" data-i18n-aria="sidebar.hide"></button></div>
    <button class="new-chat" id="newChat"><span id="newIcon"></span><span data-i18n="chat.new"></span><span class="shortcut">Ctrl K</span></button>
    <label class="search"><span id="searchIcon"></span><input id="search" data-i18n-placeholder="sidebar.search" data-i18n-aria="sidebar.search"></label>
    <div class="history-heading" data-i18n="sidebar.historyHeading"></div><nav id="history"></nav>
    <div class="side-bottom"><div class="device"><span class="device-dot"></span><div><strong data-i18n="sidebar.device"></strong><small id="deviceLabel"></small></div><button class="icon" id="refreshModels" data-i18n-title="sidebar.refreshModels" data-i18n-aria="sidebar.refreshModels"></button></div><button class="settings-button" id="openSettings"><span id="settingsIcon"></span><span data-i18n="sidebar.settings"></span><span class="version" id="appVersion">v0.6.1</span></button></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main>
    <header><div class="header-left"><button class="icon" id="toggleSide" data-i18n-title="sidebar.history" data-i18n-aria="header.toggleSideAria"></button><div class="model-picker"><select id="model" data-i18n-aria="header.modelSelect"><option value="" data-i18n="header.connecting"></option></select><span class="model-sub" data-i18n="header.modelSub"></span></div></div><div class="header-right"><span class="connection" id="connection"><i></i><span data-i18n="header.connection"></span></span><div class="lang-picker"><button class="lang-button" id="langToggle" type="button" aria-haspopup="menu" aria-expanded="false" data-i18n-title="lang.menu" data-i18n-aria="lang.menu"><span id="langIcon"></span><span id="langCode"></span></button><div id="langMenu" class="lang-menu hidden" role="menu" data-i18n-aria="lang.menu"></div></div><button class="icon" id="themeToggle" data-i18n-title="header.theme" data-i18n-aria="header.theme"></button><button class="icon" id="exportChat" data-i18n-title="header.export" data-i18n-aria="header.export"></button></div></header>
    <div id="conversation" tabindex="0" data-i18n-aria="conversation.aria">
      <section id="welcome"><div class="welcome-orbit"><img class="welcome-trowel" src="/logo.svg" data-i18n-alt="welcome.logoAlt"></div><div class="eyebrow" data-i18n="welcome.eyebrow"></div><h1 data-i18n="welcome.title"></h1><p data-i18n-html="welcome.subtitle"></p><div class="suggestions"><button data-i18n-prompt="welcome.app.prompt"><span>⌘</span><strong data-i18n="welcome.app.title"></strong><small data-i18n="welcome.app.sub"></small></button><button data-i18n-prompt="welcome.file.prompt"><span>▤</span><strong data-i18n="welcome.file.title"></strong><small data-i18n="welcome.file.sub"></small></button><button data-i18n-prompt="welcome.tests.prompt"><span>✓</span><strong data-i18n="welcome.tests.title"></strong><small data-i18n="welcome.tests.sub"></small></button></div></section>
      <div id="messages" aria-live="polite"></div>
    </div>
    <div class="composer-area"><button class="jump hidden" id="jump" data-i18n-title="composer.jump" data-i18n-aria="composer.jump">↓</button><div id="statusLine" role="status"></div><div class="composer" id="dropZone"><div id="attachments"></div><textarea id="prompt" rows="1" data-i18n-placeholder="composer.placeholder" data-i18n-aria="composer.aria"></textarea><div class="composer-tools"><div class="composer-left"><button class="icon" id="attach" data-i18n-title="composer.attach" data-i18n-aria="composer.attach"></button><input type="file" id="fileInput" multiple hidden><button class="mode-button" id="agentToggle" aria-pressed="false" data-i18n-title="composer.agentHint"><span id="agentIcon"></span><span id="modeLabel" data-i18n="mode.chat"></span><span class="mode-dot"></span></button><span class="context-label" id="contextLabel">16K</span></div><div class="composer-right"><button class="icon" id="mic" data-i18n-title="composer.mic" data-i18n-aria="composer.mic"></button><button id="send" class="send" data-i18n-title="composer.send" data-i18n-aria="composer.send"></button></div></div></div><div class="composer-caption"><span id="privacyCaption" data-i18n="composer.caption"></span><span class="key-hint" data-i18n="composer.keyHint"></span></div></div>
  </main>
</div>
<dialog id="settingsDialog"><div class="dialog-heading"><div><span class="eyebrow" data-i18n="settings.eyebrow"></span><h2 data-i18n="settings.title"></h2></div><button class="icon dialog-close" data-i18n-aria="settings.closeAria">×</button></div><form id="settingsForm"><label><span data-i18n="settings.workspace"></span><input id="workspace" required placeholder="C:\Projects"></label><p class="field-note" data-i18n="settings.workspaceNote"></p><label><span data-i18n="settings.approval"></span><select id="approvalMode"><option value="ask" data-i18n="settings.approval.ask"></option><option value="auto" data-i18n="settings.approval.auto"></option><option value="full" data-i18n="settings.approval.full"></option></select></label><div class="settings-row"><label><span data-i18n="settings.provider"></span><select id="provider"><option value="ollama">Ollama</option><option value="openai" data-i18n="settings.provider.openai"></option></select></label><label><span data-i18n="settings.toolMode"></span><select id="toolMode"><option value="auto" data-i18n="settings.toolMode.auto"></option><option value="native" data-i18n="settings.toolMode.native"></option><option value="text" data-i18n="settings.toolMode.text"></option></select></label></div><label id="ollamaUrlRow"><span data-i18n="settings.ollamaUrl"></span><input id="ollamaUrl" placeholder="http://127.0.0.1:11434"></label><label id="baseUrlRow"><span data-i18n="settings.baseUrl"></span><input id="baseUrl" placeholder="http://127.0.0.1:8080/v1"></label><label id="apiKeyRow"><span data-i18n="settings.apiKey"></span><input id="apiKey" type="password" autocomplete="off" data-i18n-placeholder="settings.apiKeyUnset"></label><p class="field-note" data-i18n="settings.toolNote"></p><div class="settings-row"><label><span data-i18n="settings.context"></span><select id="context"><option value="4096"></option><option value="8192"></option><option value="16384"></option><option value="32768"></option><option value="65536"></option><option value="131072"></option></select></label><label><span data-i18n="settings.maxSteps"></span><select id="maxSteps"><option>4</option><option>8</option><option>12</option><option>24</option><option>40</option><option>60</option></select></label></div><label class="switch-row"><span><strong data-i18n="settings.thinking"></strong><small data-i18n="settings.thinkingNote"></small></span><input type="checkbox" id="thinking"></label><div class="settings-row"><label><span data-i18n="settings.replyLanguage"></span><select id="replyLanguage"><option value="ui" data-i18n="settings.replyLanguage.ui"></option><option value="auto" data-i18n="settings.replyLanguage.auto"></option></select></label><label><span data-i18n="settings.theme"></span><select id="themeSelect"><option value="light" data-i18n="settings.theme.light"></option><option value="dark" data-i18n="settings.theme.dark"></option><option value="system" data-i18n="settings.theme.system"></option></select></label></div><div class="settings-devices"><span><strong data-i18n="devices.entryTitle"></strong><small data-i18n="devices.entryNote"></small></span><button type="button" class="secondary" id="openDevices" data-i18n="devices.open"></button></div><div class="settings-info"><strong data-i18n="settings.filesTitle"></strong><p data-i18n="settings.filesP1"></p><p data-i18n="settings.filesP2"></p></div><div id="settingsError" class="form-error"></div><button type="submit" class="primary" data-i18n="settings.save"></button></form></dialog>
<dialog id="devicesDialog" class="wide"><div class="dialog-heading"><div><span class="eyebrow" data-i18n="devices.eyebrow"></span><h2 data-i18n="devices.title"></h2></div><button class="icon dialog-close" data-i18n-aria="common.close">×</button></div><div class="tabs" role="tablist"><button type="button" class="tab active" role="tab" data-tab="this" data-i18n="devices.tab.this"></button><button type="button" class="tab" role="tab" data-tab="network" data-i18n="devices.tab.network"></button><button type="button" class="tab" role="tab" data-tab="pool" data-i18n="devices.tab.pool"></button></div><div id="devicesBody"></div><div id="devicesError" class="form-error" role="alert"></div></dialog>
<dialog id="voiceDialog"><div class="dialog-heading"><h2 data-i18n="composer.mic"></h2><button class="icon dialog-close" data-i18n-aria="common.close">×</button></div><p data-i18n="voice.p1"></p><p data-i18n="voice.p2"></p><button id="startVoice" class="primary" data-i18n="voice.start"></button></dialog>
<div id="chatMenu" class="chat-menu hidden" role="menu" data-i18n-aria="chat.actions"><button id="renameMenu" role="menuitem" data-i18n="chat.rename"></button><button id="deleteMenu" class="danger" role="menuitem" data-i18n="chat.delete"></button></div>
<dialog id="deleteDialog"><div class="dialog-heading"><h2 data-i18n="delete.title"></h2><button class="icon dialog-close" data-i18n-aria="common.close">×</button></div><p id="deleteTitle"></p><p data-i18n="delete.note"></p><div class="dialog-actions"><button id="cancelDelete" class="secondary" data-i18n="common.cancel"></button><button id="confirmDelete" class="primary" data-i18n="chat.delete"></button></div></dialog>
<dialog id="trashDialog"><div class="dialog-heading"><div><span class="eyebrow" data-i18n="trash.eyebrow"></span><h2 data-i18n="trash.title"></h2></div><button class="icon dialog-close" data-i18n-aria="common.close">×</button></div><div id="trashList"></div></dialog>
<div id="toast" role="alert"></div>
<script src="/i18n/locales.js"></script>
<script src="/i18n.js"></script>
<script src="/app.js"></script>
<script src="/devices.js"></script>
</body></html>
