name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Syntax check (node --check)
        run: npm run check
      - name: Tests
        run: npm test

  package:
    name: Packaging smoke build (Linux, unpacked)
    runs-on: ubuntu-latest
    needs: [test, compute-cpu]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: electron-builder --dir
        run: npx electron-builder --linux dir --publish never
      - name: Desktop smoke test (Xvfb)
        run: |
          export KVALAH_TEST_ROOT="$RUNNER_TEMP/kvalah-smoke" KVALAH_SMOKE_TEST=1
          xvfb-run -a release/linux-unpacked/kvalah --no-sandbox
          test -f "$KVALAH_TEST_ROOT/smoke-result.json"
          head -c 600 "$KVALAH_TEST_ROOT/smoke-result.json"

  mac-update:
    name: macOS self-update smoke (unsigned build)
    runs-on: macos-latest
    needs: [test, compute-cpu]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- test/mac-updater.test.mjs
      - name: Build ARM64 DMG and ZIP (ad-hoc signed)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg zip --arm64 --publish never
      - name: Update an installed copy with the real helper, open and codesign
        run: node scripts/mac-update-smoke.mjs release
      - name: Upload ARM64 test packages
        uses: actions/upload-artifact@v7
        with:
          name: compute-macos-arm64
          path: |
            release/*-mac-arm64.dmg
            release/*-mac-arm64.zip
          if-no-files-found: error

  compute-cpu:
    name: Compute CPU integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.12'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0
          python -m pip install numpy==2.3.5 transformers==5.24.1 tokenizers==0.23.3 safetensors==0.8.0 peft==0.22.0 Jinja2==3.1.6 mistral-common==1.13.1
          python -c "import torch, numpy, transformers, tokenizers, safetensors, peft; assert torch.version.cuda is None"
      - name: Run real Python and HTTPS tests
        env:
          KVALAH_COMPUTE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -o pipefail
          node --test --test-concurrency=1 test/compute2-stability.test.mjs test/compute2-e2e.test.mjs test/compute2-python.test.mjs test/fusion.test.mjs test/fusion-production.test.mjs | tee compute-cpu-test.log
          ! grep -Ei '^.*# skip .* (not available|runtime)' compute-cpu-test.log | grep -vi 'mlx'
      - run: node scripts/fusion-stream-smoke.mjs fusion-stream-smoke.jsonl short
      - name: Upload CPU test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compute-cpu-test-log
          path: compute-cpu-test.log
