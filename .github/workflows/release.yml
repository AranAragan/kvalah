name: Release

# Push a tag like v0.7.0 (it must match package.json "version").
# Builds Windows (NSIS + portable zip), macOS (dmg + zip, x64 + arm64) and Linux (AppImage + deb),
# signs Windows builds when signing secrets exist, publishes a GitHub Release with latest*.yml
# (auto-update feeds) and SHA256SUMS.txt, then updates the Scoop bucket and submits to winget.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.7.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - id: version
        name: Tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then echo "::error::Tag $TAG does not match package.json version $version"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"
          node scripts/release-notes.mjs "$version" > /dev/null
      - run: npm ci
      - run: npm run check
      - run: npm test

  linux:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build AppImage + deb
        run: npx electron-builder --linux --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml

  macos:
    needs: verify
    runs-on: macos-latest
    env:
      # Optional (docs/SIGNING.md). Without them the app is ad-hoc signed and updates itself with
      # mac-updater.cjs (zip + latest-mac.yml below are its feed; keep publishing them).
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build dmg + zip (x64, arm64)
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          if [ -z "${CSC_LINK:-}" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          npx electron-builder --mac --publish never
      - name: Self-update smoke test (unsigned builds)
        if: env.CSC_LINK == ''
        run: node scripts/mac-update-smoke.mjs release
      - uses: actions/upload-artifact@v7
        with:
          name: dist-macos
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml

  windows:
    needs: verify
    runs-on: windows-latest
    env:
      # SignPath (preferred for open source, docs/SIGNING.md §1)
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      # Azure Trusted Signing / Artifact Signing (alternative, docs/SIGNING.md §2)
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
      # Certificate subject CN; electron-updater accepts only updates signed by this publisher.
      KVALAH_WIN_PUBLISHER: ${{ vars.KVALAH_WIN_PUBLISHER }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - id: mode
        name: Choose signing mode
        shell: bash
        run: |
          if [ -n "$SIGNPATH_API_TOKEN" ] && [ -n "$SIGNPATH_ORGANIZATION_ID" ]; then mode=signpath
          elif [ -n "$AZURE_CLIENT_SECRET" ] && [ -n "$AZURE_SIGNING_ENDPOINT" ]; then mode=azure
          else mode=unsigned; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Windows signing mode: $mode"

      # Unsigned or Azure: one electron-builder run; Azure signs exe, uninstaller and installer itself.
      - name: Build NSIS installer + portable zip
        if: steps.mode.outputs.mode != 'signpath'
        shell: bash
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = unsigned ]; then
            unset KVALAH_WIN_PUBLISHER AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET
          fi
          npx electron-builder --win --publish never

      # SignPath: sign kvalah.exe in the unpacked app, package it, then sign the installer.
      - name: Build unpacked app (SignPath stage 1)
        if: steps.mode.outputs.mode == 'signpath'
        shell: bash
        run: npx electron-builder --win dir --publish never
      - id: upload-unpacked
        if: steps.mode.outputs.mode == 'signpath'
        uses: actions/upload-artifact@v7
        with:
          name: win-unpacked-unsigned
          path: release/win-unpacked/
          if-no-files-found: error
      - name: Sign kvalah.exe (SignPath)
        if: steps.mode.outputs.mode == 'signpath'
        uses: SignPath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'kvalah' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: win-unpacked
          github-artifact-id: ${{ steps.upload-unpacked.outputs.artifact-id }}
          parameters: |
            version: "${{ needs.verify.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed/win-unpacked
      - name: Build installer + portable zip from the signed app (SignPath stage 2)
        if: steps.mode.outputs.mode == 'signpath'
        shell: bash
        run: npx electron-builder --win nsis zip --x64 --prepackaged signed/win-unpacked --publish never
      - id: upload-installer
        if: steps.mode.outputs.mode == 'signpath'
        uses: actions/upload-artifact@v7
        with:
          name: win-installer-unsigned
          path: release/kvalah-*-win-x64-setup.exe
          if-no-files-found: error
      - name: Sign installer (SignPath)
        if: steps.mode.outputs.mode == 'signpath'
        uses: SignPath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'kvalah' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          parameters: |
            version: "${{ needs.verify.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed/installer
      - name: Use the signed installer and refresh latest.yml hashes
        if: steps.mode.outputs.mode == 'signpath'
        shell: bash
        run: |
          cp -f signed/installer/*.exe release/
          node scripts/refresh-latest-yml.mjs release

      - name: Show signatures
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe, release/win-unpacked/kvalah.exe -ErrorAction SilentlyContinue |
            ForEach-Object { $s = Get-AuthenticodeSignature $_.FullName; "{0}: {1} {2}" -f $_.Name, $s.Status, $s.SignerCertificate.Subject }
      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          if-no-files-found: error
          path: |
            release/kvalah-*-win-x64-setup.exe
            release/kvalah-*-win-x64-portable.zip
            release/latest.yml

  publish:
    needs: [verify, linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS.txt
        working-directory: dist
        run: |
          sha256sum -- * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          node scripts/release-notes.mjs "$VERSION" > notes.md
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); else flags+=(--latest); fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "kvalah $VERSION" --notes-file notes.md "${flags[@]}"
          fi

  package-managers:
    needs: [verify, publish]
    if: needs.verify.outputs.prerelease != 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fill hashes into the Scoop and winget manifests
        shell: bash
        run: |
          gh release download "$TAG" --pattern SHA256SUMS.txt --dir dist
          node scripts/package-managers.mjs --version "$VERSION" --sums dist/SHA256SUMS.txt
      - name: Commit manifests (Scoop bucket in this repo)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket packaging/winget
          if git diff --cached --quiet; then echo "No manifest changes"; exit 0; fi
          git commit -m "chore: package manifests for v$VERSION"
          git push || echo "::warning::Could not push manifests (branch protection?). Commit them manually."
      # One winget-pkgs PR at a time: while an earlier submission for this package is still open
      # (for example the first "New package" PR waiting for moderator review), do not open another one.
      # The manifests are already committed above; the next release after the merge submits an update.
      # Set the repository variable WINGET_SUBMIT=false to switch submissions off entirely.
      - name: Check for a pending winget-pkgs pull request
        id: winget
        if: env.WINGET_TOKEN != '' && vars.WINGET_SUBMIT != 'false'
        shell: bash
        run: |
          if ! pending=$(gh pr list -R microsoft/winget-pkgs --state open --search "AranAragan.Kvalah in:title" --json number --jq 'map(.number|tostring)|join(",")'); then
            echo "::warning::Could not check microsoft/winget-pkgs for open pull requests; winget submission skipped."
            echo "submit=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -n "$pending" ]; then
            echo "::notice::winget submission skipped: microsoft/winget-pkgs PR #$pending for AranAragan.Kvalah is still open."
            echo "submit=false" >> "$GITHUB_OUTPUT"
          else
            echo "submit=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Submit to winget (microsoft/winget-pkgs)
        if: steps.winget.outputs.submit == 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          $url = "https://github.com/AranAragan/kvalah/releases/download/v$env:VERSION/kvalah-$env:VERSION-win-x64-setup.exe"
          $exists = $true
          try { Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/a/AranAragan/Kvalah | Out-Null } catch { $exists = $false }
          if ($exists) {
            .\wingetcreate.exe update AranAragan.Kvalah --version $env:VERSION --urls $url --release-notes-url "https://github.com/AranAragan/kvalah/releases/tag/v$env:VERSION" --submit --token $env:WINGET_TOKEN
          } else {
            .\wingetcreate.exe submit --token $env:WINGET_TOKEN "packaging/winget/manifests/a/AranAragan/Kvalah/$env:VERSION"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
